<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <title>Mis tareas</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <p class="eyebrow">Un paso cada vez</p>
      <h1>Mis tareas<span>.</span></h1>
      <p class="intro">Anota lo importante. Lo demás puede esperar.</p>
    </header>

    <section class="task-panel" aria-labelledby="task-heading">
      <h2 id="task-heading" class="visually-hidden">Lista de tareas</h2>
      <form class="task-form" id="task-form">
        <label class="visually-hidden" for="task-input">Nueva tarea</label>
        <input id="task-input" name="task" type="text" maxlength="120" placeholder="¿Qué tienes pendiente?" autocomplete="off" required>
        <button type="submit">Añadir <span aria-hidden="true">+</span></button>
      </form>

      <div class="list-heading">
        <h2>Tu lista</h2>
        <p id="task-count" aria-live="polite">0 tareas pendientes</p>
      </div>
      <ul id="task-list" class="task-list" aria-label="Tareas"></ul>
      <p id="empty-state" class="empty-state">Todavía no hay tareas. Empieza por una pequeña.</p>
    </section>
    <footer>Guardado automáticamente en este dispositivo</footer>
  </main>
  <aside class="clock" aria-label="Reloj analógico">
    <div class="clock-face" id="clock-face" role="img" aria-label="Hora actual">
      <span class="clock-number clock-number-12" aria-hidden="true">12</span>
      <span class="clock-number clock-number-3" aria-hidden="true">3</span>
      <span class="clock-number clock-number-6" aria-hidden="true">6</span>
      <span class="clock-number clock-number-9" aria-hidden="true">9</span>
      <span class="clock-hand clock-hour" id="clock-hour" aria-hidden="true"></span>
      <span class="clock-hand clock-minute" id="clock-minute" aria-hidden="true"></span>
      <span class="clock-hand clock-second" id="clock-second" aria-hidden="true"></span>
      <span class="clock-pin" aria-hidden="true"></span>
    </div>
  </aside>
</body>
</html>
